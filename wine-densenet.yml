name: wine-densenet
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Core scientific stack (binary-ABI compatible)
  - numpy
  - matplotlib>=3.8
  - scikit-learn
  - pillow
  - tqdm
  - seaborn
  - jupyterlab
  # Ensure modern C++ runtime (fixes CXXABI_1.3.15 errors)
  - libstdcxx-ng>=12
  - libgcc-ng>=12
  - pip
  - pip:
      # TensorFlow GPU (pip wheel bundles CUDA if supported)
      - tensorflow[and-cuda]==2.17.0
      # Kaggle + deps
      - kaggle
      - python-slugify
      - text-unidecode
